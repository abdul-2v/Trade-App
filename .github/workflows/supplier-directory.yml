name: Refresh Midlands supplier directory
on:
  push:
    branches: [main]
    paths:
      - 'scripts/import-supplier-directory.py'
      - 'data/supplier-query-rules.json'
      - '.github/workflows/supplier-directory.yml'
  workflow_dispatch:
  schedule:
    - cron: '35 4 * * 1'
permissions:
  contents: write
concurrency:
  group: supplier-directory-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install osmium==4.2.0
      - name: Extract all Midlands county merchant records
        run: python scripts/import-supplier-directory.py
      - name: Validate generated data
        run: node scripts/test-supplier-directory.cjs --require-data
      - name: Publish directory to mobile repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/TradeSupplierDirectory.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh Midlands OpenStreetMap supplier directory'
          git pull --rebase origin main
          git push origin HEAD:main
