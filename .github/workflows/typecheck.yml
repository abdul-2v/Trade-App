name: App TypeScript check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check TS and TSX syntax (Metro red-screen prevention)
        run: npm run check:syntax

      - name: Audit interactive controls in every screen
        run: npm run check:ux

      - name: Check Expo-compatible dependency versions
        run: CI=1 npx expo install --check

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Test booking and route matching logic
        run: npm run test:logic

      - name: Stress test clustered map geometry with 10,000 fictional markers
        run: node scripts/test-map-density.cjs

      - name: Test native notification destinations and safe app role routing
        run: node scripts/test-notification-destinations.cjs

      - name: Verify sponsored results, labels and organic ranking
        run: node scripts/test-sponsored-visibility.cjs

      - name: Verify store webhook signature and fail-closed payment gates
        run: node scripts/test-store-webhook.cjs

      - name: Verify native purchasing blocks disabled checkout and account switching
        run: node scripts/test-store-client.cjs
